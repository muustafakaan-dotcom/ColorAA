<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ColorAA — Renk Eşleştirme Oyunu</title>
    <meta name="description" content="Dönen dairedeki renk şeritlerine doğru renkteki topları fırlat ve daireyi temizle!">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud" class="hud-hidden">
            <button id="btn-hud-home" class="hud-home" title="Ana Menü">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <path d="M12 3C11.4 3 10.8 3.2 10.3 3.6L3.3 9.6C2.5 10.2 2 11.1 2 12V20C2 21.1 2.9 22 4 22H9V16H15V22H20C21.1 22 22 21.1 22 20V12C22 11.1 21.5 10.2 20.7 9.6L13.7 3.6C13.2 3.2 12.6 3 12 3Z"/>
                </svg>
            </button>
            <div id="powerups-container" class="powerups-container">
                <button id="btn-pu-rainbow" class="pu-btn" title="Gökkuşağı"><span class="pu-icon">🌈</span> <span id="pu-count-rainbow">0</span></button>
                <button id="btn-pu-shield" class="pu-btn" title="Kalkan"><span class="pu-icon">🛡️</span> <span id="pu-count-shield">0</span></button>
                <button id="btn-pu-bomb" class="pu-btn" title="Bomba"><span class="pu-icon">💣</span> <span id="pu-count-bomb">0</span></button>
            </div>
            <button id="btn-second-chance" class="pu-btn" style="position: absolute; left: 50%; transform: translateX(-50%); top: 64px; background: linear-gradient(135deg, var(--teal), var(--purple)); color: white; display: none; z-index: 100; border: none; font-size: 11px; padding: 6px 14px; box-shadow: 0 4px 15px rgba(124, 92, 252, 0.4); pointer-events: all;">
                BİR ŞANS DAHA (<span id="second-chance-timer">5</span>)
            </button>
            <div class="hud-item">
                <span class="hud-label">BÖLÜM</span>
                <span class="hud-value" id="hud-level">1</span>
            </div>
        </div>

        <!-- ====== HOME SCREEN ====== -->
        <div id="screen-home" class="screen">
            <div class="screen-content">
                <div class="home-top">
                    <h1 id="game-title">Color<span>AA</span></h1>
                    <p class="subtitle">Renkleri eşleştir, daireyi temizle</p>
                    <div id="total-stars-display" class="total-stars-display">
                        <span class="star-icon">★</span>
                        <span id="total-stars-count">0</span>
                    </div>
                </div>
                <div class="home-actions">
                    <button id="btn-play" class="btn-play">OYNA</button>
                    <button id="btn-endless" class="btn-endless">♾ SONSUZ MOD</button>
                    <button id="btn-daily" class="btn-daily">🎰 GÜNLÜK ÖDÜL <span id="daily-countdown"></span></button>
                    <button id="btn-levels" class="btn-ghost">BÖLÜMLER</button>
                    <button id="btn-store" class="btn-ghost" style="margin-top: -12px;">MAĞAZA</button>
                    <button id="btn-powerups" class="btn-ghost" style="margin-top: -12px;">GÜÇLENDİRİCİLER</button>
                    <button id="btn-achievements" class="btn-ghost" style="margin-top: -12px;">BAŞARIMLAR</button>
                    <button id="btn-settings" class="btn-ghost" style="margin-top: -12px;">AYARLAR</button>
                </div>
            </div>
        </div>

        <!-- ====== ACHIEVEMENTS ====== -->
        <div id="screen-achievements" class="screen hidden">
            <div class="levels-wrapper">
                <div class="levels-header">
                    <button id="btn-back-achievements" class="btn-icon" aria-label="Geri">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <h2 class="levels-heading">Başarımlar</h2>
                    <div style="width:40px"></div>
                </div>
                <div style="flex:1; overflow-y:auto; padding:0 8px 40px;">
                    <div id="achievements-list" class="store-list"></div>
                </div>
            </div>
        </div>

        <!-- ====== DAILY WHEEL ====== -->
        <div id="screen-wheel" class="screen hidden">
            <div class="screen-content wheel-content">
                <h2 class="screen-heading">GÜNLÜK ÖDÜL</h2>
                <div class="wheel-wrapper">
                    <div class="wheel-pointer">▼</div>
                    <canvas id="wheelCanvas" width="300" height="300"></canvas>
                </div>
                <div id="wheel-result" class="wheel-result hidden"></div>
                <div class="screen-actions">
                    <button id="btn-spin" class="btn-play">ÇEVİR!</button>
                    <button id="btn-wheel-close" class="btn-ghost hidden">TAMAM</button>
                </div>
            </div>
        </div>

        <!-- ====== LEVEL SELECT ====== -->
        <div id="screen-levels" class="screen hidden">
            <div class="levels-wrapper">
                <div class="levels-header">
                    <button id="btn-back-home" class="btn-icon" aria-label="Geri">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <h2 class="levels-heading">Bölümler</h2>
                    <div style="width:40px"></div>
                </div>
                <div id="levels-scroll">
                    <div id="levels-grid"></div>
                </div>
            </div>
        </div>

        <!-- ====== STORE ====== -->
        <div id="screen-store" class="screen hidden">
            <div class="levels-wrapper">
                <div class="levels-header">
                    <button id="btn-back-store" class="btn-icon" aria-label="Geri">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <h2 class="levels-heading">Mağaza</h2>
                    <div class="total-stars-badge" style="display:flex; align-items:center; gap:4px;">
                        <span class="star-icon" style="color:var(--yellow); font-size:16px;">★</span>
                        <span id="store-stars-count" style="font-weight:700; color:var(--text);">0</span>
                    </div>
                </div>
                <div id="store-scroll" style="flex:1; overflow-y:auto; padding:0 8px 40px;">
                    <div id="store-list" class="store-list">
                        <!-- Palettes injected via JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ====== POWERUPS ====== -->
        <div id="screen-powerups" class="screen hidden">
            <div class="levels-wrapper">
                <div class="levels-header">
                    <button id="btn-back-powerups" class="btn-icon" aria-label="Geri">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <h2 class="levels-heading">Güçlendiriciler</h2>
                    <div class="total-stars-badge" style="display:flex; align-items:center; gap:4px;">
                        <span class="star-icon" style="color:var(--yellow); font-size:16px;">★</span>
                        <span id="powerups-stars-count" style="font-weight:700; color:var(--text);">0</span>
                    </div>
                </div>
                <div id="powerups-scroll" style="flex:1; overflow-y:auto; padding:0 8px 40px;">
                    <div id="powerups-list" class="store-list">
                        <!-- Powerups injected via JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ====== GAME OVER (Endless) ====== -->
        <div id="screen-gameover" class="screen hidden">
            <div class="screen-content">
                <h2 class="screen-heading" style="color:var(--coral)">OYUN BİTTİ</h2>
                <div class="gameover-stats">
                    <div class="gameover-stat">
                        <span class="gameover-label">SKOR</span>
                        <span class="gameover-value" id="gameover-score">0</span>
                    </div>
                    <div class="gameover-stat">
                        <span class="gameover-label">EN YÜKSEK</span>
                        <span class="gameover-value" id="gameover-hiscore">0</span>
                    </div>
                    <div class="gameover-stat">
                        <span class="gameover-label">KOMBO</span>
                        <span class="gameover-value" id="gameover-combo">0</span>
                    </div>
                </div>
                <div class="screen-actions">
                    <button id="btn-endless-retry" class="btn-play">TEKRAR OYNA</button>
                    <button id="btn-endless-home" class="btn-ghost">ANA MENÜ</button>
                </div>
            </div>
        </div>

        <!-- ====== LEVEL COMPLETE ====== -->
        <div id="screen-levelup" class="screen hidden">
            <div class="screen-content">
                <h2 class="screen-heading">BÖLÜM <span id="completed-level">1</span> TAMAM!</h2>
                <div id="level-stars" class="level-stars"></div>
                <div class="screen-actions">
                    <button id="btn-nextlevel" class="btn-play">SONRAKİ BÖLÜM →</button>
                    <button id="btn-go-home-2" class="btn-ghost">ANA MENÜ</button>
                </div>
            </div>
        </div>

        <!-- ====== SETTINGS ====== -->
        <div id="screen-settings" class="screen hidden">
            <div class="screen-content">
                <h2 class="screen-heading">AYARLAR</h2>
                
                <div class="settings-list">
                    <div class="setting-item">
                        <span class="setting-label">Açık Tema (Light Mode)</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggle-theme">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">Arka Plan Müziği</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggle-bgm" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">Ses Efektleri</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggle-sfx" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

                <div class="screen-actions">
                    <button id="btn-close-settings" class="btn-ghost">KAPAT</button>
                </div>
            </div>
        </div>

        <!-- Combo popup -->
        <div id="combo-popup" class="hidden">
            <span id="combo-text"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
